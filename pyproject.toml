[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-system"
version = "0.1.0"
description = "Discover, understand, and manage the software and configuration that make up a Linux system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.11"]
gui = ["PyGObject>=3.50"]

[project.scripts]
linux-system = "linux_system.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linux_system"]

[tool.hatch.build.targets.wheel.force-include]
"database" = "linux_system/database"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
indent-width = 8
